name: 02 Verification Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate-1-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pytest

      - name: Run Gate 1 Verification Suite
        run: pytest -v
